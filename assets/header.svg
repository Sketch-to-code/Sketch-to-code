<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3192"/>
      <stop offset="100%" stop-color="#1BFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="url(#bg)"/>

  <!-- animated wave layer -->
  <path fill="#ffffff" opacity="0.08">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,150 C300,120 900,180 1200,150 L1200,180 L0,180 Z;
        M0,160 C300,190 900,110 1200,160 L1200,180 L0,180 Z;
        M0,150 C300,120 900,180 1200,150 L1200,180 L0,180 Z" />
  </path>

  <!-- name: fade + slide in -->
  <text x="600" y="85" font-family="Segoe UI, Verdana, sans-serif" font-size="40"
        font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0">
    Arunaditya Raguraman
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="0,15" to="0,0" begin="0.2s" dur="1s" fill="freeze"/>
  </text>

  <!-- subtitle: fade in slightly later -->
  <text x="600" y="120" font-family="Segoe UI, Verdana, sans-serif" font-size="18"
        fill="#ffffff" text-anchor="middle" opacity="0">
    CSE (AI &amp; Robotics) | Full-Stack, IoT &amp; Mobile Dev
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1s" fill="freeze"/>
  </text>
</svg>

